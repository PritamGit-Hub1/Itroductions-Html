<!DOCTYPE html>

<head>

    <title>List: order list - un order list</title>
</head>
<body>
    <p>Un order List</p>
    <ul>
        <li>Pritam</li>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
    </ul>
    <p>Order list</p>
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Orange</li>
        <li>Guava</li>
   </ol>
    <p>Nested List</p>
    <ul>
        <li>Fruit
            <ul>
                <li>Apple</li>
                <li>Orange</li>
            </ul>
        </li>
        <li>Vegetable</li>
    </ul>
</body>
