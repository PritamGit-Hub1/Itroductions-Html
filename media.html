<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media in Html</title>
</head>
<body>
    <h1>Media in Html</h1>
    <h4>Audio</h4>
    <audio controls src="a.mp3" type="audio/mpeg"></audio>
    <h4>Video</h4>
    <video width="320" height="240" controls>
        <source src="harry.mp4">
        <!-- Your browser does not support the video tag. -->
      </video> 
</body>
</html>
