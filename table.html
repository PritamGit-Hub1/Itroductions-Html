<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Example</title>
</head>
<body>
    <p>This is the table example.</p>
    <table border="1">
        
      <tr>
        <th>S.no</th>
        <th>Name</th>
        <th>Age</th>
      </tr>
      <tr>
        <td>1</td>
        <td>Pritam</td>
        <td>24</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Rahul</td>
        <td>25</td>
      </tr>
      <tr>
        <td>3</td>
        <td>suriya</td>
        <td>27</td>
      </tr>
    </table>
    <br>
    <table border="1">
        <tr>
            <th rowspan="2">Row 1,2,3</th>
            <th colspan="2">clo 1 & 2</th>
        </tr>
        <tr>
            <td>Item A</td>
            <td>Item B</td>
        </tr>
    </table>
</body>
</html>
